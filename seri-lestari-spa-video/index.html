    <style>
      /* ── Type: Archivo (variable wght 100–900, wdth 62–125) + Instrument Serif + Caveat ── */
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/caveat-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      /* ── Palette (≈70% cream ground · 20% ink/wine · 10% sage/pink accents) ── */
      :root {
        --cream: #f4ecdf;
        --cream2: #ebe0cd;
        --ink: #201a19;
        --wine: #6b1d2c;
        --wine2: #4e1420;
        --sage: #a9b99e;
        --sageD: #71876a;
        --pink: #e8c2bd;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--cream);
      }
      #main {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--cream);
      }

      /* ── Shared utilities used inside every scene ── */
      .abs { position: absolute; white-space: nowrap; }
      .fill { position: absolute; inset: 0; }
      .sans {
        font-family: "Archivo", sans-serif;
        font-weight: 900;
        font-stretch: 100%;
        line-height: 0.86;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .serif {
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      .it { font-style: italic; }
      .label {
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-stretch: 62%;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 30px;
        line-height: 1;
      }
      .hand { font-family: "Caveat", cursive; font-weight: 700; line-height: 1; }
      .ch { display: inline-block; }
      .mask { overflow: hidden; }
      .ink { color: var(--ink); }
      .wine { color: var(--wine); }
      .creamc { color: var(--cream); }
      .pinkc { color: var(--pink); }
      .sagec { color: var(--sageD); }
      svg { overflow: visible; display: block; }
      .st {
        fill: none;
        stroke: var(--ink);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .spk { position: absolute; }
      .spk svg { width: 100%; height: 100%; fill: currentColor; }
    </style>
  </head>
