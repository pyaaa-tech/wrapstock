<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Claude Promo</title>
<style>
  @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400;
    src: url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400;
    src: url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) format('woff2'); }

  :root { --cream: #F3EDE4; --coral: #E07B57; --gold: #F4B860; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #050407; }
  canvas#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #ov { position: absolute; inset: 0; pointer-events: none; color: var(--cream);
        font-family: 'Inter Display', 'Inter', sans-serif; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
  .label { font-size: 22px; font-weight: 500; letter-spacing: .42em; text-transform: uppercase; }
  .ch { display: inline-block; will-change: transform, opacity, filter; }
  .el { will-change: transform, opacity, filter; }

  /* Intro / outro wordmark */
  .word { font-size: 168px; line-height: 1; letter-spacing: -0.01em; }
  .tag  { font-size: 26px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; color: rgba(243,237,228,.72); }
  #introWord { top: 688px; }
  #introTag  { top: 880px; }
  #outroWord { top: 690px; }
  #outroTag  { top: 880px; font-size: 40px; letter-spacing: .02em; text-transform: none; color: rgba(243,237,228,.86);}
  #outroUrl  { top: 962px; }
  .url { display: inline-block; font-size: 22px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase;
         padding: 12px 28px 12px 34px; border-radius: 999px; border: 1px solid rgba(224,123,87,.55);
         color: #F7C9B4; background: rgba(224,123,87,.08); }

  /* Models section */
  #mLabel { top: 54px; color: #F0A584; }
  #mTitle { top: 88px; font-size: 64px; line-height: 1.05; }
  #mFoot  { top: 972px; }
  .pill { display: inline-block; font-size: 24px; font-weight: 500; letter-spacing: .08em; padding: 14px 30px;
          border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.16);
          color: rgba(243,237,228,.9); backdrop-filter: blur(6px); }
  .pill b { color: #F4B860; font-weight: 600; }

  /* Pro section */
  #pLabel { top: 70px; color: #F0A584; }
  #pTitle { top: 102px; font-size: 150px; line-height: 1; }
  .grad { background: linear-gradient(100deg, #FFF3E6 0%, #F7C9A6 30%, #E8845F 58%, #F4B860 84%, #FFE3B8 100%);
          background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }

  #vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="ov">
  <div class="abs"><div id="introWord" class="abs word serif" data-split></div></div>
  <div id="introTag" class="abs tag el"></div>

  <div id="mLabel" class="abs label el"></div>
  <div id="mTitle" class="abs serif" data-split-words></div>
  <div id="mFoot" class="abs el"><span class="pill"></span></div>

  <div id="pLabel" class="abs label el"></div>
  <div id="pTitle" class="abs serif el"><span class="grad"></span></div>

  <div id="outroWord" class="abs word serif" data-split></div>
  <div id="outroTag" class="abs tag serif el"></div>
  <div id="outroUrl" class="abs el"><span class="url"></span></div>

  <div id="vignette"></div>
  <div id="fade"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
